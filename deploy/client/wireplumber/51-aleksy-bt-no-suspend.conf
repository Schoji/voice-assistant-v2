# Keeps bluetooth speakers streaming silence instead of suspending them after
# a few idle seconds: waking one up takes about a second, which swallows
# short words like "tak" completely.
# Install as the user running aleksy-client (no sudo):
#   cp 51-aleksy-bt-no-suspend.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
