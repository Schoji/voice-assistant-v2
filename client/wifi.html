<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleksy — ustawienia</title>
<style>
  :root {
    --bg: #0e1013; --card: #171a1f; --line: #262a31; --text: #e7e9ec; --muted: #8b929c;
    --accent: #7cc4ff; --ok: #5fd08a; --warn: #f2c14e; --bad: #ff6b6b; --field: #0e1013;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --card: #fff; --line: #e1e4e8; --text: #1b1f24; --muted: #5f6873;
      --accent: #1f6fb8; --ok: #1d8a4a; --warn: #a86b00; --bad: #c62828; --field: #fff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header a { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; }
  h2 button { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .status { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .muted { color: var(--muted); font-weight: 400; font-size: 14px; }
  .note { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; }
  .note.bad { border-color: var(--bad); color: var(--bad); }
  .note.busy { border-color: var(--warn); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .net { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 2px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .net .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i { width: 4px; background: var(--line); border-radius: 1px; }
  .bars i.on { background: var(--text); }
  form { display: flex; gap: 8px; padding: 0 2px 12px; flex-wrap: wrap; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0e1013; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; }
  .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); font-style: italic; padding: 4px 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ustawienia</h1>
    <a href="/">panel →</a>
  </header>

  <section class="card">
    <h2>Wi-Fi</h2>
    <div class="status"><span class="dot" id="dot"></span><span id="status">…</span></div>
    <div id="notes"></div>
  </section>

  <section class="card">
    <h2>Sieci w pobliżu <button id="rescan" type="button">Odśwież</button></h2>
    <ul id="networks"></ul>
  </section>

  <section class="card">
    <h2>Zapamiętane sieci</h2>
    <ul id="saved"></ul>
  </section>

  <section class="card">
    <h2>Głośnik Bluetooth</h2>
    <div class="status"><span class="dot" id="btdot"></span><span id="btstatus">…</span></div>
    <div id="btnotes"></div>
  </section>

  <section class="card">
    <h2>Urządzenia Bluetooth <button id="btscan" type="button">Szukaj</button></h2>
    <ul id="btdevices"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

let state = null;
let open = null; // ssid whose password form is showing, kept across refreshes
let sent = null; // what we just asked for, the hotspot may vanish before we hear back

function bars(signal) {
  const b = el("span", { className: "bars", title: signal + "%" });
  [25, 50, 75, 100].forEach((level, i) => b.append(el("i", { className: signal >= level - 20 ? "on" : "", style: `height:${4 + i * 3}px` })));
  return b;
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function connectForm(ssid, secure, manual) {
  const form = el("form");
  const name = manual ? el("input", { placeholder: "nazwa sieci", required: true, autocapitalize: "off" }) : null;
  const pass = el("input", { type: "password", placeholder: secure ? "hasło" : "sieć otwarta — bez hasła", autocomplete: "current-password" });
  if (!secure && !manual) pass.disabled = true;
  const go = el("button", { className: "primary", type: "submit", textContent: "Połącz" });
  form.append(...(name ? [name] : []), pass, go);
  form.onsubmit = async e => {
    e.preventDefault();
    const target = name ? name.value.trim() : ssid;
    go.disabled = true;
    try {
      await post("/api/wifi/connect", { ssid: target, password: pass.value });
      sent = target; open = null;
      render();
    } catch (err) {
      alert(err.message);
      go.disabled = false;
    }
  };
  setTimeout(() => (name || pass).focus(), 0);
  return form;
}

function renderNetworks() {
  const list = $("networks");
  const items = state.networks.map(n => {
    const current = state.mode === "client" && state.connection === n.ssid;
    const btn = el("button", { className: "net", type: "button" },
      el("span", { className: "name", textContent: n.ssid }),
      el("span", { className: "muted", textContent: current ? "połączono" : n.secure ? "🔒" : "" }),
      bars(n.signal));
    btn.onclick = () => { open = open === n.ssid ? null : n.ssid; renderNetworks(); };
    const li = el("li", {}, btn);
    if (open === n.ssid) li.append(connectForm(n.ssid, n.secure));
    return li;
  });
  const other = el("button", { className: "net", type: "button" }, el("span", { className: "name muted", textContent: "Inna sieć…" }));
  other.onclick = () => { open = open === "\0other" ? null : "\0other"; renderNetworks(); };
  const otherLi = el("li", {}, other);
  if (open === "\0other") otherLi.append(connectForm(null, true, true));
  if (!items.length) items.push(el("li", { className: "empty", textContent: "Nic nie widać — spróbuj odświeżyć." }));
  // don't rebuild under someone typing a password
  if (!list.contains(document.activeElement) || document.activeElement.tagName !== "INPUT") list.replaceChildren(...items, otherLi);
}

function renderSaved() {
  const list = $("saved");
  if (!state.saved.length) { list.replaceChildren(el("li", { className: "empty", textContent: "Brak." })); return; }
  list.replaceChildren(...state.saved.map(s => {
    const forget = el("button", { type: "button", textContent: "Zapomnij" });
    forget.onclick = async () => {
      if (!confirm(`Zapomnieć sieć ${s.name}?`)) return;
      try { await post("/api/wifi/forget", { name: s.name }); poll(); } catch (err) { alert(err.message); }
    };
    return el("li", { className: "row" }, el("span", { textContent: s.name }), forget);
  }));
}

function render() {
  const s = state;
  const [label, color] = {
    client:   [`Połączony z ${s.connection}`, "var(--ok)"],
    hotspot:  [`Hotspot ${s.hotspot_ssid} — brak znanej sieci`, "var(--warn)"],
    offline:  ["Brak sieci", "var(--bad)"],
    starting: ["Sprawdzam…", "var(--muted)"],
  }[s.mode] || [s.mode, "var(--muted)"];
  $("status").replaceChildren(label, s.ip ? el("span", { className: "muted", textContent: s.ip }) : "");
  $("dot").style.background = color;

  const notes = [];
  if (sent) notes.push(el("p", { className: "note busy", textContent:
    `Łączę z ${sent}. Jeśli się uda, hotspot ${s.hotspot_ssid} zniknie — wróć telefonem do swojej sieci. ` +
    `Jeśli nie, hotspot wróci za chwilę i zobaczysz tu błąd.` }));
  else if (s.busy) notes.push(el("p", { className: "note busy", textContent: s.busy[0].toUpperCase() + s.busy.slice(1) + "…" }));
  if (s.error) notes.push(el("p", { className: "note bad", textContent: s.error }));
  $("notes").replaceChildren(...notes);

  renderNetworks();
  renderSaved();
}

async function poll() {
  try {
    state = await (await fetch("/api/wifi", { cache: "no-store" })).json();
    if (sent && !state.busy && (state.error || state.connection === sent)) sent = null;
    render();
  } catch {
    // expected while aleksy switches networks
  }
}

$("rescan").onclick = async () => {
  $("rescan").disabled = true;
  try { state.networks = (await post("/api/wifi/scan")).networks; render(); } catch {}
  $("rescan").disabled = false;
};

let bt = null;

function renderBt() {
  const s = bt;
  let label, color;
  if (!s.speaker) [label, color] = ["Gra głośnik Aleksego", "var(--ok)"];
  else if (s.sink) [label, color] = [`Gra przez ${s.speaker.name}`, "var(--ok)"];
  else if (s.connected) [label, color] = [`${s.speaker.name} — łączę dźwięk…`, "var(--warn)"];
  else [label, color] = [`${s.speaker.name} poza zasięgiem — gra głośnik Aleksego`, "var(--warn)"];
  const status = [label];
  if (s.speaker) {
    const off = el("button", { type: "button", textContent: "Wróć do głośnika Aleksego", style: "margin-left:auto" });
    off.onclick = () => post("/api/bt/off").then(pollBt).catch(err => alert(err.message));
    status.push(off);
  }
  $("btstatus").replaceChildren(...status);
  $("btstatus").style.cssText = "display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap";
  $("btdot").style.background = color;

  const notes = [];
  if (s.busy) notes.push(el("p", { className: "note busy", textContent: s.busy[0].toUpperCase() + s.busy.slice(1) + "…" }));
  if (s.error) notes.push(el("p", { className: "note bad", textContent: s.error }));
  $("btnotes").replaceChildren(...notes);
  $("btscan").disabled = !!s.busy;

  const list = $("btdevices");
  if (!s.devices.length) { list.replaceChildren(el("li", { className: "empty", textContent: "Włącz w głośniku tryb parowania i kliknij „Szukaj”." })); return; }
  list.replaceChildren(...s.devices.map(d => {
    const chosen = s.speaker && s.speaker.mac === d.mac;
    const tags = [d.connected && "połączone", d.paired && !d.connected && "sparowane", !d.audio && "nie audio?"].filter(Boolean).join(" · ");
    const kids = [el("span", {}, d.name + " ", el("span", { className: "muted", textContent: tags }))];
    if (!chosen) {
      const use = el("button", { type: "button", className: d.audio ? "primary" : "", textContent: "Graj tutaj", disabled: !!s.busy });
      use.onclick = () => post("/api/bt/use", { mac: d.mac }).then(pollBt).catch(err => alert(err.message));
      kids.push(use);
    }
    if (d.paired) {
      const forget = el("button", { type: "button", textContent: "Zapomnij", disabled: !!s.busy });
      forget.onclick = () => confirm(`Zapomnieć ${d.name}?`) && post("/api/bt/forget", { mac: d.mac }).then(pollBt).catch(err => alert(err.message));
      kids.push(forget);
    }
    return el("li", { className: "row" }, ...kids);
  }));
}

async function pollBt() {
  try {
    bt = await (await fetch("/api/bt", { cache: "no-store" })).json();
    renderBt();
  } catch {}
}

$("btscan").onclick = () => post("/api/bt/scan").then(pollBt).catch(err => alert(err.message));

poll();
pollBt();
setInterval(poll, 3000);
setInterval(pollBt, 2000);
</script>
</body>
</html>
